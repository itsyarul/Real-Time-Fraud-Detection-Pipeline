name: Real-time-fraud-detection-pipeline

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  minio-data:
  grafana-data:
  prometheus-data:
  pushgateway-data:
  airflow-logs:
  spark-events:
  spark-warehouse:
  spark-work-dir:
  spark-checkpoints:
  airflow_postgres_data:

x-common: &common
  restart: unless-stopped

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"


services:

  kafka:

    image: apache/kafka:${KAFKA_VERSION}

    hostname: kafka

    ports:

      - "${KAFKA_PORT}:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

    healthcheck:

      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "localhost:9092"
        ]

      interval: 20s

      timeout: 10s

      retries: 10

    volumes:

      - kafka-data:/var/lib/kafka/data

    <<: *common

    networks:
      - backend

  kafka-ui:

    image: provectuslabs/kafka-ui:latest

    depends_on:

      kafka:

        condition: service_healthy

    ports:

      - "${KAFKA_UI_PORT}:8080"

    environment:

      KAFKA_CLUSTERS_0_NAME: Local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    healthcheck:

      test: ["CMD", "wget", "--spider", "http://localhost:8080"]

      interval: 30s

      timeout: 10s

      retries: 5

    <<: *common

    networks:
      - frontend

  minio:

    image: minio/minio:${MINIO_VERSION}

    hostname: minio

    command: server /data --console-address ":9001"

    ports:

      - "${MINIO_API_PORT}:9000"

      - "${MINIO_CONSOLE_PORT}:9001"

    environment:

      MINIO_ROOT_USER: ${MINIO_ROOT_USER}

      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      MINIO_PROMETHEUS_AUTH_TYPE: public

      MINIO_PROMETHEUS_URL: http://prometheus:9090

    volumes:

      - minio-data:/data

    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]

      interval: 30s

      timeout: 10s

      retries: 5

    <<: *common

    networks:
      - backend

  mc:

    image: minio/mc:${MINIO_MC_VERSION}

    restart: "no"

    depends_on:

      minio:

        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      ${MINIO_ROOT_USER}
      ${MINIO_ROOT_PASSWORD};

      mc mb --ignore-existing local/bronze;
      mc mb --ignore-existing local/silver;
      mc mb --ignore-existing local/gold;
      mc mb --ignore-existing local/spark-events;
      mc mb --ignore-existing local/spark-checkpoints;
      mc mb --ignore-existing local/quarantine;
      mc mb --ignore-existing local/ml-training;
      mc mb --ignore-existing local/models;
      mc mb --ignore-existing local/predictions;
      mc mb --ignore-existing local/fraud-alerts;
      mc mb --ignore-existing local/monitoring;

      exit 0;
      "

    networks:
      - backend

  spark-master:
    build:
      context: .
      dockerfile: apps/spark/Dockerfile
      args:
        SPARK_VERSION: ${SPARK_VERSION}
        SPARK_KAFKA_CONNECTOR_VERSION: ${SPARK_KAFKA_CONNECTOR_VERSION}
        DELTA_VERSION: ${DELTA_VERSION}
        HADOOP_AWS_VERSION: ${HADOOP_AWS_VERSION}
        AWS_SDK_V2_VERSION: ${AWS_SDK_V2_VERSION}

    image: ${SPARK_IMAGE}

    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: transactions

      CHECKPOINT_LOCATION: /opt/spark/checkpoints/kafka-test

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${MINIO_REGION}

    ports:
      - "${SPARK_MASTER_PORT}:7077"
      - "${SPARK_MASTER_UI_PORT}:8080"

    volumes:
      - spark-events:/opt/spark/events
      - spark-work-dir:/opt/spark/work
      - spark-warehouse:/opt/spark/warehouse

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/ > /dev/null"
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    <<: *common

  spark-worker:
    image: ${SPARK_IMAGE}

    depends_on:
      spark-master:
        condition: service_healthy

    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_WORKER_WEBUI_PORT: 8081

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${MINIO_REGION}

    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"

    volumes:
      - spark-events:/opt/spark/events
      - spark-work-dir:/opt/spark/work
      - spark-warehouse:/opt/spark/warehouse

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8081/ > /dev/null"
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

    <<: *common

  spark-history:
    image: ${SPARK_IMAGE}

    depends_on:
      spark-master:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      SPARK_MODE: history

      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/opt/spark/events
        -Dspark.history.ui.port=18080

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${MINIO_REGION}

    ports:
      - "${SPARK_HISTORY_UI_PORT}:18080"

    volumes:
      - spark-events:/opt/spark/events

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:18080/ > /dev/null"
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

    <<: *common

  spark-submit:
    image: ${SPARK_IMAGE}

    profiles:
      - jobs

    environment:
      SPARK_MODE: submit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}

      BRONZE_TRANSACTIONS_PATH: ${BRONZE_TRANSACTIONS_PATH}
      BRONZE_CHECKPOINT_LOCATION: ${BRONZE_CHECKPOINT_LOCATION}

      SPARK_STREAMING_CORES: ${SPARK_STREAMING_CORES}
      SPARK_STREAMING_MEMORY: ${SPARK_STREAMING_MEMORY}

      SPARK_BATCH_CORES: ${SPARK_BATCH_CORES}
      SPARK_BATCH_MEMORY: ${SPARK_BATCH_MEMORY}

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: ${MINIO_REGION}
      AWS_ENDPOINT_URL: ${MINIO_S3_ENDPOINT}
      MINIO_S3_ENDPOINT: ${MINIO_S3_ENDPOINT}

      GX_CONTEXT_ROOT: ${GX_CONTEXT_ROOT}
      GX_SILVER_DATASOURCE_NAME: ${GX_SILVER_DATASOURCE_NAME}
      GX_SILVER_DATA_ASSET_NAME: ${GX_SILVER_DATA_ASSET_NAME}
      GX_SILVER_BATCH_DEFINITION_NAME: ${GX_SILVER_BATCH_DEFINITION_NAME}
      GX_SILVER_EXPECTATION_SUITE_NAME: ${GX_SILVER_EXPECTATION_SUITE_NAME}
      GX_SILVER_VALIDATION_DEFINITION_NAME: ${GX_SILVER_VALIDATION_DEFINITION_NAME}

      ML_MODEL_PATH: ${ML_MODEL_PATH}
      ML_EXPERIMENT_PATH: ${ML_EXPERIMENT_PATH}

      ML_TRAINING_CORES: ${ML_TRAINING_CORES}
      ML_TRAINING_MEMORY: ${ML_TRAINING_MEMORY}

      ML_RANDOM_SEED: ${ML_RANDOM_SEED}
      ML_TEST_SIZE: ${ML_TEST_SIZE}
      ML_TRAIN_SIZE: ${ML_TRAIN_SIZE}

      ML_MODEL_NAME: ${ML_MODEL_NAME}
      ML_MODEL_VERSION: ${ML_MODEL_VERSION}
      ML_DECISION_THRESHOLD: ${ML_DECISION_THRESHOLD}
      ML_MIN_RECALL: ${ML_MIN_RECALL}

      ML_INFERENCE_MODEL_NAME: ${ML_INFERENCE_MODEL_NAME}
      ML_INFERENCE_MODEL_VERSION: ${ML_INFERENCE_MODEL_VERSION}
      ML_INFERENCE_THRESHOLD: ${ML_INFERENCE_THRESHOLD}

      ML_PREDICTIONS_PATH: ${ML_PREDICTIONS_PATH}
      ML_ALERTS_PATH: ${ML_ALERTS_PATH}
      ML_MONITORING_PATH: ${ML_MONITORING_PATH}

      ML_INFERENCE_CORES: ${ML_INFERENCE_CORES}
      ML_INFERENCE_MEMORY: ${ML_INFERENCE_MEMORY}

    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

    volumes:
      - ${PROJECT_ROOT:-.}/apps/spark/jobs:/opt/spark/work-dir/jobs
      - ${PROJECT_ROOT:-.}/apps/quality:/opt/spark/work-dir/quality
      - ${PROJECT_ROOT:-.}/apps/great_expectations:/opt/spark/work-dir/great_expectations
      - ${PROJECT_ROOT:-.}/apps/ml:/opt/spark/work-dir/ml
      - ${PROJECT_ROOT:-.}/apps/monitoring:/opt/spark/work-dir/monitoring
      - spark-events:/opt/spark/events
      - spark-work-dir:/opt/spark/work
      - spark-warehouse:/opt/spark/warehouse
      - spark-checkpoints:/opt/spark/checkpoints
      - ${PROJECT_ROOT:-.}/data:/opt/spark/work-dir/data:ro
    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  producer:
    build:
      context: .
      dockerfile: apps/producer/Dockerfile

      args:
        PYTHON_VERSION: ${PYTHON_VERSION}

    profiles:
      - jobs

    environment:
      DATA_PATH: /app/data/creditcard.csv

      PRODUCER_KAFKA_BOOTSTRAP_SERVERS: ${PRODUCER_KAFKA_BOOTSTRAP_SERVERS}
      PRODUCER_KAFKA_TOPIC: ${PRODUCER_KAFKA_TOPIC}

      PRODUCER_MODE: ${PRODUCER_MODE}

      PRODUCER_BATCH_SIZE: ${PRODUCER_BATCH_SIZE}
      PRODUCER_OFFSET: ${PRODUCER_OFFSET}

      PRODUCER_LOOP: ${PRODUCER_LOOP}

      PRODUCER_DELAY_MS: ${PRODUCER_DELAY_MS}

      PRODUCER_SHUFFLE: ${PRODUCER_SHUFFLE}
      PRODUCER_SEED: ${PRODUCER_SEED}
    volumes:
      - ./data:/app/data

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - backend
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        PYTHON_VERSION: ${PYTHON_VERSION}
    image: ${AIRFLOW_IMAGE}
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "Airflow" \
          --lastname "Admin" \
          --role Admin \
          --email "admin@example.com" || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - backend

  airflow-webserver:
    image: ${AIRFLOW_IMAGE}
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    command:
      - webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - backend

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE}
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command:
      - scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - backend

  # ============================================================
  # Monitoring Stack
  # ============================================================

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - pushgateway
      - kafka-exporter
    networks:
      - backend
      - frontend
    <<: *common

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    hostname: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - frontend
    <<: *common

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    hostname: alertmanager
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    ports:
      - "${ALERTMANAGER_PORT}:9093"
    environment:
      SLACK_WEBHOOK: ${SLACK_WEBHOOK}
      ALERTMANAGER_EXTERNAL_URL: http://localhost:${ALERTMANAGER_PORT}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    networks:
      - backend
      - frontend
    <<: *common

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    hostname: kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
      - "--log.level=warn"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    <<: *common

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    hostname: pushgateway
    command:
      - "--web.listen-address=:9091"
      - "--persistence.file=/pushgateway/pushgateway.db"
      - "--persistence.interval=5m"
    ports:
      - "${PUSHGATEWAY_PORT}:9091"
    volumes:
      - pushgateway-data:/pushgateway
    networks:
      - backend
    <<: *common

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    hostname: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - backend
    <<: *common

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    hostname: node-exporter
    command:
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|etc)($$|/)"
    networks:
      - backend
    <<: *common

  metrics-pusher:
    build:
      context: .
      dockerfile: apps/monitoring/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    image: ${METRICS_PUSHER_IMAGE}
    container_name: metrics-pusher
    hostname: metrics-pusher
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      MINIO_S3_ENDPOINT: ${MINIO_S3_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MONITORING_BUCKET: monitoring
      MONITORING_PREFIX: ml-inference
    depends_on:
      pushgateway:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - backend
    <<: *common
