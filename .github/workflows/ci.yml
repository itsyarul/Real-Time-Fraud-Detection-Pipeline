# ============================================================
# Workflow 1: CI -- Lint & Static Analysis
#
# Runs on every push and pull_request to main / develop.
# Checks Python code style and validates YAML / Docker Compose.
# ============================================================

name: CI — Lint & Static Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------
  # Job 1: Python linting
  # --------------------------------------------------------
  lint-python:
    name: Python — flake8 / black / isort
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linting tools
        run: pip install flake8 black isort

      # 1. Stop build on Python syntax errors & undefined names
      - name: flake8 — syntax errors & undefined names
        run: |
          flake8 apps/ airflow/dags/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      # 2. PEP-8 style report (reports warnings without failing build)
      - name: flake8 — PEP8 style report
        run: |
          flake8 apps/ airflow/dags/ \
            --max-line-length=120 \
            --exit-zero \
            --statistics \
            --exclude=__pycache__,*.pyc

      # 3. Formatting check (shows diff in logs without blocking build)
      - name: black — format check
        continue-on-error: true
        run: |
          black --check --diff \
            apps/ airflow/dags/ \
            --line-length=120

      # 4. Import order check (shows diff in logs without blocking build)
      - name: isort — import order check
        continue-on-error: true
        run: |
          isort --check-only --diff \
            apps/ airflow/dags/ \
            --profile=black \
            --line-length=120


  # --------------------------------------------------------
  # Job 2: YAML + Docker Compose validation
  # --------------------------------------------------------
  lint-yaml:
    name: YAML & Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint — Lint YAML files
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            docker-compose.yml \
            monitoring/

      # Validate the Compose file parses correctly using the safe CI env
      - name: docker compose config — syntax validation
        run: docker compose --env-file .env.ci config --quiet
